targets:
  - esp32p4

dependencies:
  espressif/esp_video: "==2.0.0"
  espressif/esp_cam_sensor: "==2.0.0"
  espressif/esp_sccb_intf: "==0.0.8"
  espressif/esp_ipa: "==1.3.1"
  espressif/cmake_utilities: "==0.5.3"
  espressif/esp_h264: "==1.0.4"
  espressif/usb_host_uvc: "==2.4.2"
  espressif/esp-dl: "==3.2.4"
  espressif/dl_fft: "==0.3.1"
  espressif/esp-dsp: "==1.7.0"
  espressif/esp_new_jpeg: "==0.6.1"
  # esp_hosted uses esp_wifi_remote's C6 capability Kconfig even though this
  # firmware exposes its application HTTP server through Ethernet.
  espressif/esp_wifi_remote: "==1.3.2"
  espressif/esp_hosted: "==2.12.3"
  espressif/wifi_remote_over_eppp: "==0.3.2"
  espressif/eppp_link: "==1.1.4"
  espressif/esp_serial_slave_link: "==1.1.2"
  espressif/mdns: "==1.9.1"
  idf: ">=5.5,<5.6"
  protocol_examples_common:
    path: ${IDF_PATH}/examples/common_components/protocol_examples_common
